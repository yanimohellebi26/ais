# In-memory database configuration for tests
spring.datasource.url=jdbc:h2:mem:ais_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart settings (mirror production caps)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload service configuration for tests
app.upload.dir=build/uploads-test
app.upload.max-size-bytes=10485760
app.upload.per-user-limit=10
