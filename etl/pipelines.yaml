load-vessels:
  desc: "Load new vessels statics data in database"
  steps:
    - func: extract_data_from_file
      kwargs:
        selected_map: [ "mmsi", "base_date_time", "vessel_name", "imo", "call_sign",
          "vessel_type_id", "length", "width", "draft", "cargo_type_id","transceiver_class"]
    - func: normalize_ais
      kwargs: {}
    - func: remove_rows_with_empty
      kwargs:
        required: ["mmsi","base_date_time"]
    - func: remove_rows_with_wrong_format
      kwargs: {}
    - func: clean_vessel_duplication
      kwargs: {}
    - func: get_vessels_db
      kwargs: {}
    - func: transform_vessel_delta
      kwargs: {}
    - func: load_vessel_to_db
      kwargs:
        table: "vessel"
        upsert_keys: ["mmsi"]

load-positions:
  desc: "Load positions in database"
  steps:
    - func: extract_data_from_file
      kwargs:
        selected_map: ["mmsi","base_date_time","lon","lat","sog","cog","heading","status"]
    - func: normalize_ais
      kwargs: {}
    - func: remove_rows_with_wrong_format
      kwargs: {}
    - func: downsample_ais
      kwargs: {}
    - func: filter_small_movements
      kwargs:
        min_dist: 1
    - func: detect_vessel_incoherent_positions
      kwargs: {}
    - func: load_position_db
      kwargs:
        handle_missing: "skip"
        batch_size: 100000
    - func: refresh_latest_positions
      kwargs:
        view_name: "latest_positions"
        concurrently: true

load-ports:
  desc: "Load ports in database"
  steps:
    - func: extract_data_from_file
      kwargs:
        selected_map: ["code","name","latitude","longitude","country_code"]
        separator: ';'
    - func: remove_rows_with_empty
      kwargs:
        required: ["code","name","latitude","longitude","country_code"]
    - func: load_port_db
      kwargs:
        handle_missing: "skip"

load-trajectories:
  desc: "Calculate and insert vessel trajectories from positions"
  steps:
    - func: compute_trajectories_db
      kwargs: {}

update-countries:
  desc: "Update the countries with their geometries"
  steps:
    - func: transform_countries_raw
      kwargs: {}
    - func: update_country_geometries
      kwargs: {}

update-protected-areas:
