    - func: clean_wdpa
      kwargs: {}
    - func: map_to_mcd
      kwargs: {}
    - func: split_tables
      kwargs: {}
    - func: load_pa_infos
      kwargs: 
        batch_size: 5000
    - func: load_protected_area
      kwargs:
        batch_size: 5000
    - func: cleanup_wdpa_files
      kwargs: {}

