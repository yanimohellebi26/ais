version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: ais-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway
    container_name: ais-flyway
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    volumes:
      - ./db/migrations:/flyway/sql
    command: -connectRetries=10 -url=jdbc:postgresql://db:5432/${POSTGRES_DB} -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    restart: "no"
    networks:
      - ais-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - ais-net
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MODE: ${VITE_MODE}
    container_name: ais-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MODE=${VITE_MODE}
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: ais-etl-api
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - AIS_BASE_URL=${AIS_BASE_URL}
      - API_KEYS_FILE=${API_KEYS_FILE}
      - SUPER_API_KEY=${SUPER_API_KEY}
      - PIPELINES_FILE_YAML=${PIPELINES_FILE_YAML}
      - ENV_MODE=docker
    volumes:
      - ./etl/data:/app/data
    depends_on:
      - db
      - redis
      - etl-worker
    ports:
      - "8000:8000"
    networks:
      - ais-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: ais-redis
    ports:
      - "6379:6379"
    networks:
      - ais-net
    restart: "no"


  etl-worker:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: ais-etl-worker
    command: celery -A api.celery_app.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://ais-redis:6379/0
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - AIS_BASE_URL=${AIS_BASE_URL}
      - PIPELINES_FILE_YAML=${PIPELINES_FILE_YAML}
      - ENV_MODE=docker
    depends_on:
      - redis
      - db
    volumes:
      - ./etl:/app
      - ./etl/data:/app/data
    networks:
      - ais-net
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ais-pgadmin
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ais-net
    restart: unless-stopped

volumes:
  db_data:
    name: ais-db-data
  pgadmin_data:
    name: ais-pgadmin-data

networks:
  ais-net:
    driver: bridge
