services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: ais-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway
    container_name: ais-flyway
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command: -connectRetries=10 -url=jdbc:postgresql://db:5432/${POSTGRES_DB} -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    restart: "no"
    networks:
      - ais-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - ais-net
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MODE: ${VITE_MODE}
        VITE_ETL_API_URL: ${VITE_ETL_API_URL}
        VITE_ETL_WS_URL: ${VITE_ETL_WS_URL}
    container_name: ais-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MODE=${VITE_MODE}
        - VITE_ETL_API_URL=${VITE_ETL_API_URL}
        - VITE_ETL_WS_URL=${VITE_ETL_WS_URL}
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ais-redis
    ports:
      - "6379:6379"
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  etl-api:
    build:
      context: ./etl
      dockerfile: docker/Dockerfile-api
    container_name: ais-etl-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      # Database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # API
      - AIS_BASE_URL=${AIS_BASE_URL}
      - SUPER_API_KEY=${SUPER_API_KEY}
      # Pipelines
      - PIPELINES_FILE_YAML=/app/pipelines.yaml
      - ENV_MODE=docker
    volumes:
      - ./etl/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  etl-worker:
    build:
      context: ./etl
      dockerfile: docker/Dockerfile-worker
    container_name: ais-etl-worker
    command: sh -c "celery -A worker.celery_app worker --loglevel=info --concurrency=$CELERY_CONCURRENCY"
    environment:
      # Database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # API
      - AIS_BASE_URL=${AIS_BASE_URL}
      # Pipelines
      - PIPELINES_FILE_YAML=/app/pipelines.yaml
      - ENV_MODE=docker
    volumes:
      - ./etl/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ais-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ais-pgadmin
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ais-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ais-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ais-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ais-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ais-net
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ais-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ais-net
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: ais-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - ais-net
    ports:
      - "9187:9187"
    restart: unless-stopped

volumes:
  db_data:
    name: ais-db-data
  pgadmin_data:
    name: ais-pgadmin-data
  prometheus_data:
    name: ais-prometheus-data
  grafana_data:
    name: ais-grafana-data

networks:
  ais-net:
    driver: bridge