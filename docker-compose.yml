version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: ais-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway
    container_name: ais-flyway
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    volumes:
      - ./db/migrations:/flyway/sql
    command: -connectRetries=10 -url=jdbc:postgresql://db:5432/${POSTGRES_DB} -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    restart: "no"
    networks:
      - ais-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - ais-net
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ais-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MODE=${VITE_MODE}
    networks:
      - ais-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: ais-etl
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - AIS_BASE_URL=${AIS_BASE_URL}
      - LOG_DIR=${LOG_DIR}
      - AIS_DOWNLOAD_FOLDER=${AIS_DOWNLOAD_FOLDER}
      - GENERATED_FOLDER=${GENERATED_FOLDER}
    volumes:
      - ./data/logs:/data/logs
      - ./data/downloads:/data/downloads
      - ./data/generated:/data/generated
    depends_on:
      - db
    networks:
      - ais-net
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ais-pgadmin
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ais-net
    restart: unless-stopped

volumes:
  db_data:
    name: ais-db-data
  pgadmin_data:
    name: ais-pgadmin-data

networks:
  ais-net:
    driver: bridge
